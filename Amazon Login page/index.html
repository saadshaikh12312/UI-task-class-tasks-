<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Amazon login</title>
</head>
 
<body>
  <main>
    <div class="logo"><img src="https://static.vecteezy.com/system/resources/thumbnails/019/136/319/small_2x/amazon-logo-amazon-icon-free-free-vector.jpg" alt="Amazon"></div>
    <form action="#" method="get">
      <H2>Sign in or create account</H2>
      <label for="username">Enter mobile number or email</label>
      <input type="text" name="username" id="username">
      <button type="submit">Continue</button>

      <p>By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.</p>

      <hr>

      <h4>Buying for work?</h4>
      <p><a href="#">Create a free business account</a></p>
    </form>
  </main>
</body>

</html>
